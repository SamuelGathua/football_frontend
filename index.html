<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportzStream Live - World Sports TV Hub</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pitch: #07090e;
      --bg-charcoal: #12161f;
      --bg-panel: #181e2b;
      --bg-card: #1f2737;
      --accent-gold: #ffb800;
      --accent-gold-hover: #ffc833;
      --accent-gold-glow: rgba(255, 184, 0, 0.35);
      --accent-cyan: #00e5ff;
      --accent-cyan-hover: #33ebff;
      --accent-cyan-glow: rgba(0, 229, 255, 0.25);
      --text-main: #f3f6fa;
      --text-muted: #8d9ba8;
      --border-color: #263143;
      --live-green: #2ed573;
      --font-display: 'Chakra Petch', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-pitch);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: linear-gradient(180deg, var(--bg-charcoal) 0%, rgba(18, 22, 31, 0.98) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-family: var(--font-display);
      font-size: 1.15rem;
      box-shadow: 0 0 15px var(--accent-gold-glow);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-title span {
      color: var(--accent-gold);
    }

    .sports-only-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: rgba(255, 184, 0, 0.12);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.75px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-green);
      box-shadow: 0 0 8px var(--live-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* Sub-header Filter Tabs */
    .filter-bar {
      background: var(--bg-charcoal);
      border-bottom: 1px solid var(--border-color);
      padding: 0.6rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      overflow-x: auto;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }

    .tab-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan-glow);
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px var(--accent-gold-glow);
    }

    .tab-icon {
      font-size: 1rem;
    }

    .view-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.75rem;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    /* Embedded Player Container */
    .player-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 180px);
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }

    .player-header-info {
      padding: 0.65rem 1.25rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .channel-source-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .current-category-tag {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }

    .current-url-crumb {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-family: monospace;
      background: rgba(0, 229, 255, 0.08);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(0, 229, 255, 0.2);
    }

    .iframe-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 650px;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 650px;
      border: none;
      display: block;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-pitch);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      transition: opacity 0.4s ease;
      pointer-events: none;
      opacity: 0;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 184, 0, 0.2);
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--text-main);
    }

    /* Quick URL Drawer / Direct Switch */
    .custom-bar {
      margin-top: 0.75rem;
      background: var(--bg-charcoal);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .custom-input-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 280px;
    }

    .custom-input-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .custom-input-group input {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .custom-input-group input:focus {
      border-color: var(--accent-cyan);
    }

    .load-url-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .load-url-btn:hover {
      background: var(--accent-gold-hover);
      box-shadow: 0 0 10px var(--accent-gold-glow);
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 0.85rem 1.75rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-charcoal);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      header {
        padding: 0.75rem 1rem;
      }
      .filter-bar {
        padding: 0.5rem 1rem;
      }
      main {
        padding: 0.75rem 1rem;
      }
      .iframe-container, iframe {
        min-height: 500px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand" onclick="switchCategory('https://tvgarden.world/tv/sports', 'Global Sports TV', this)">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">Sportz<span>Stream</span> Live</div>
    </div>
    
    <div class="sports-only-badge">
      <div class="pulse-dot"></div>
      <span>Sports Only Mode</span>
    </div>
  </header>

  <!-- Filter & Navigation Bar -->
  <section class="filter-bar">
    <div class="nav-tabs" id="category-tabs">
      <button class="tab-btn active" onclick="switchCategory('https://tvgarden.world/tv/sports', 'Global Live Sports Channels', this)">
        <span class="tab-icon">🏆</span> All Live Sports
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/schedule/', 'Live Match Schedule', this)">
        <span class="tab-icon">📅</span> Live Match Schedule
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/tv/uk', 'United Kingdom Sports & TV', this)">
        <span class="tab-icon">🇬🇧</span> UK Sports
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/tv/us', 'United States Sports & TV', this)">
        <span class="tab-icon">🇺🇸</span> USA Sports
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/tv/es', 'Spain Sports & TV', this)">
        <span class="tab-icon">🇪🇸</span> Spain Sports
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/tv/de', 'Germany Sports & TV', this)">
        <span class="tab-icon">🇩🇪</span> Germany Sports
      </button>

      <button class="tab-btn" onclick="switchCategory('https://tvgarden.world/tv/fr', 'France Sports & TV', this)">
        <span class="tab-icon">🇫🇷</span> France Sports
      </button>
    </div>

    <div class="view-actions">
      <button class="action-btn" onclick="reloadFrame()" title="Reload Stream Player">
        ↻ Reload
      </button>
      <button class="action-btn" onclick="toggleFullScreen()" title="Full Screen View">
        ⛶ Fullscreen
      </button>
    </div>
  </section>

  <!-- Main Viewport Area -->
  <main>
    <div class="player-wrapper" id="player-wrapper">
      
      <div class="player-header-info">
        <div class="channel-source-info">
          <span class="current-category-tag" id="active-title">Global Live Sports Channels</span>
          <span class="current-url-crumb" id="active-url">https://tvgarden.world/tv/sports</span>
        </div>
      </div>

      <div class="iframe-container">
        <!-- Loading Indicator -->
        <div class="loading-overlay" id="loading-overlay">
          <div class="spinner"></div>
          <div class="loading-text" id="loading-text">Tuning into Live Sports...</div>
        </div>

        <!-- Embedded Sports Platform Player -->
        <iframe 
          id="sports-frame"
          src="https://tvgarden.world/tv/sports" 
          width="100%" 
          height="100%" 
          frameborder="0" 
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>

    </div>

    <!-- Quick Direct Channel / Country Switcher -->
    <div class="custom-bar">
      <div class="custom-input-group">
        <label for="direct-url-input">Direct TV Garden URL:</label>
        <input type="text" id="direct-url-input" placeholder="e.g. https://tvgarden.world/tv/sports or country code like us, uk, it">
        <button class="load-url-btn" onclick="loadCustomUrl()">Tune In</button>
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">
        Tip: Enter a country code (e.g. <code>it</code>, <code>br</code>, <code>za</code>) or custom stream path.
      </div>
    </div>
  </main>

  <footer>
    SportzStream Hub &bull; Dedicated Sports Portal &bull; Powered by TV Garden Live Directory
  </footer>

  <script>
    var frame = document.getElementById('sports-frame');
    var activeTitle = document.getElementById('active-title');
    var activeUrl = document.getElementById('active-url');
    var loadingOverlay = document.getElementById('loading-overlay');
    var loadingText = document.getElementById('loading-text');

    /**
     * Switch category / channel source in the embedded player
     */
    function switchCategory(url, title, btnElement) {
      if (!url) return;

      // Update Active Tab State
      var tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(function(tab) {
        tab.classList.remove('active');
      });

      if (btnElement) {
        btnElement.classList.add('active');
      }

      // Update Labels
      activeTitle.textContent = title;
      activeUrl.textContent = url;
      document.getElementById('direct-url-input').value = url;

      // Show loader briefly for smooth UX
      showLoading(title);

      // Load into iframe
      frame.src = url;
    }

    function showLoading(title) {
      loadingText.textContent = 'Loading ' + title + '...';
      loadingOverlay.classList.add('active');

      // Hide loading after iframe initializes
      setTimeout(function() {
        loadingOverlay.classList.remove('active');
      }, 1200);
    }

    frame.addEventListener('load', function() {
      loadingOverlay.classList.remove('active');
    });

    /**
     * Reload iframe
     */
    function reloadFrame() {
      showLoading(activeTitle.textContent);
      var current = frame.src;
      frame.src = '';
      setTimeout(function() {
        frame.src = current;
      }, 100);
    }

    /**
     * Load custom URL or country code
     */
    function loadCustomUrl() {
      var input = document.getElementById('direct-url-input').value.trim();
      if (!input) return;

      var targetUrl = input;
      // If user typed a short 2-letter country code like "us", "uk", "it"
      if (/^[a-zA-Z]{2}$/.test(input)) {
        targetUrl = 'https://tvgarden.world/tv/' + input.toLowerCase();
      } else if (!input.startsWith('http://') && !input.startsWith('https://')) {
        targetUrl = 'https://tvgarden.world/' + input;
      }

      switchCategory(targetUrl, 'Custom: ' + targetUrl, null);
    }

    /**
     * Fullscreen Toggle for the player container
     */
    function toggleFullScreen() {
      var elem = document.getElementById('player-wrapper');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
